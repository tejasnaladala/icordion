    <rect x="450" y="230" width="50" height="44" fill="#142914" stroke="#39ff14"/>
  </g>

  <!-- bass buttons -->
  <g fill="#0f1a0f" stroke="#2faf1a">
    <rect x="120" y="300" width="60" height="36"/>
    <rect x="190" y="300" width="60" height="36"/>
