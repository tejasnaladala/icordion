    <rect x="175" y="230" width="50" height="44" fill="#142914" stroke="#39ff14"/>
    <rect x="230" y="230" width="50" height="44" fill="#142914" stroke="#39ff14"/>
    <rect x="285" y="230" width="50" height="44" fill="#39ff14" stroke="#39ff14"/>
    <rect x="340" y="230" width="50" height="44" fill="#142914" stroke="#39ff14"/>
